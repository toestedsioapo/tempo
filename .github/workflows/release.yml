# Manual dispatch only. Dry run by default. Publishing uses npm trusted publishing (OIDC) with
# provenance, through `npm publish <tarball> --provenance`. There is no token anywhere (the one-time bootstrap
# token of A-94 is gone, M6 Task 6).
# Versioning happens in this run (A-95): main keeps 0.0.0 plus one pending changeset.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and `publish --dry-run` only. Nothing is published, pushed or tagged."
        type: boolean
        default: true
      confirm:
        description: "For a real run, type exactly: publish v<version> (for example publish v0.1.0)"
        type: string
        default: ""

permissions:
  contents: read

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          v="$(npm --version)"
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1 (needed for trusted publishing)"
            exit 1
          fi
      - name: Repository must be public (provenance is not generated for private repositories)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api repos/${{ github.repository }} --jq .private)"
          echo "private=$private"
          if [ "$private" != "false" ]; then
            echo "::error::${{ github.repository }} is private. Make it public before publishing."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The repo tests describe the committed (pre-release) state, so they run before versioning:
      # `changeset version` removes the pending changeset and creates the CHANGELOGs.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:names
      - name: Version both packages from the pending changeset (not committed here)
        id: version
        run: |
          pnpm changeset version
          echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke install both packed tarballs into an empty directory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/smoke"
          (cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/tarballs/*.tgz
          got="$(./node_modules/.bin/tempo --version)"
          echo "tempo --version -> $got"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::tempo --version printed '$got', expected '$VERSION'"
            exit 1
          fi
      - name: npm publish --dry-run for both packages (dry run only)
        if: ${{ inputs.dry_run }}
        run: |
          (cd packages/core && pnpm publish --dry-run --no-git-checks)
          (cd packages/cli && pnpm publish --dry-run --no-git-checks)
          {
            echo "## Dry run: ${{ steps.version.outputs.version }}"
            echo
            echo "Packing, the manifests and the tarball contents passed. This does not prove the npm"
            echo "trusted-publisher (OIDC) setup or the bootstrap token: those are only exercised by a real run."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Only from main, only with the exact confirmation
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::a real release runs from main, not ${{ github.ref }}"
            exit 1
          fi
          if [ "${{ inputs.confirm }}" != "publish v${VERSION}" ]; then
            echo "::error::confirm must be exactly: publish v${VERSION}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version both packages from the pending changeset
        run: |
          pnpm changeset version
          got="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::versioned to $got but verify saw $VERSION"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # v0.1.0 went out without provenance: pnpm 12 does not honor NPM_CONFIG_PROVENANCE or
      # publishConfig.provenance, and the changesets publisher calls it without --provenance. So pack with
      # pnpm (it resolves `workspace:` ranges) and hand each tarball to npm itself: npm >= 11.5.1 does the OIDC
      # trusted-publishing exchange and signs the provenance. Core first, then cli (cli depends on core).
      - name: Pack both packages (pnpm pack resolves workspace: ranges)
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          (cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          ls -l "$RUNNER_TEMP/tarballs"
      - name: Publish core, then cli, with npm trusted publishing (OIDC) and provenance
        run: |
          publish_tarball() {
            name="$1"
            tarball="$2"
            if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
              echo "${name}@${VERSION} is already on npm, skipping"
              return 0
            fi
            npm publish "$tarball" --provenance --access public
          }
          publish_tarball @marvinliem/tempo-core "$RUNNER_TEMP/tarballs/marvinliem-tempo-core-${VERSION}.tgz"
          publish_tarball @marvinliem/tempo "$RUNNER_TEMP/tarballs/marvinliem-tempo-${VERSION}.tgz"
          echo "Published with npm trusted publishing (OIDC) and --provenance." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the release, tag it and create the GitHub release (only after both packages are out)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD:main
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          awk -v h="## ${VERSION}" '$0 == h { on = 1; next } /^## / { on = 0 } on' packages/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
