name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      # No version input: pnpm/action-setup reads it from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            coverage/
            packages/*/coverage/
          if-no-files-found: error
      - run: pnpm build
