name: nightly

# A-65: the 5,000-run property pass. PR CI runs 200 per property (see ci.yml).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEMPO_PROP_RUNS: "5000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # QG-02 / A-90: Stryker mutation testing of packages/core; the score must stay at or above the break threshold in stryker.config.json.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
